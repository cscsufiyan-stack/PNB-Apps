<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>PNB Shoaib CSC | Secure Access</title>
  <link rel="manifest" href="/PNB-Apps/manifest.json">
  <meta name="theme-color" content="#8A1538">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #f6f6fa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    body.dark-mode { background: #121212; }
    
    .app-container { 
      width: 100%; 
      max-width: 100%; 
      margin: 0; 
      background: #f8fafd; 
      min-height: 100vh; 
      position: relative; 
      padding-bottom: 80px; 
      display: none; 
    }
    body.dark-mode .app-container { background: #1e1e2f; }
    
    body.dark-mode .services-section { background: #1e1e2f; border-color: #3a3a4a; }
    body.dark-mode .section-title { color: #e91e63 !important; }
    body.dark-mode .service-card { background: #2a2a3a !important; border-color: #3a3a4a !important; }
    body.dark-mode .service-card i { color: #e91e63 !important; }
    body.dark-mode .service-card span { color: #ffffff !important; }
    body.dark-mode .search-card .search-flex { background: #2a2a3a !important; border-color: #e91e63 !important; }
    body.dark-mode .search-flex input { color: white !important; }
    body.dark-mode .customer-item { background: #2a2a3a !important; border-color: #e91e63 !important; }
    body.dark-mode .detail-line { background: #1e1e2f !important; border-color: #3a3a4a !important; }
    body.dark-mode .detail-line b { color: #e91e63 !important; }
    body.dark-mode .detail-line span { color: #ffffff !important; }
    body.dark-mode .service-filter-chip { background: #2a2a3a !important; color: #ddd !important; }
    body.dark-mode .service-filter-chip.active { background: linear-gradient(135deg, #e91e63, #8A1538) !important; color: white !important; }
    body.dark-mode .bottom-tab { background: rgba(30, 30, 47, 0.96) !important; }
    body.dark-mode .tab-btn { color: #aaa !important; }
    body.dark-mode .tab-btn.active { color: #e91e63 !important; background: rgba(233, 30, 99, 0.2) !important; }
    body.dark-mode .fab-tab { background: linear-gradient(135deg, #e91e63, #8A1538) !important; }
    body.dark-mode .action-btn { background: #3a3a4a !important; }
    body.dark-mode .stat-card { background: #2a2a3a !important; color: white !important; }
    body.dark-mode .stat-card small { color: #aaa !important; }
    body.dark-mode .chart-container { background: #2a2a3a !important; border-color: #3a3a4a !important; }
    
    .app-header { background: linear-gradient(135deg, #8A1538 0%, #5e0e2a 100%); padding: 18px; position: sticky; top: 0; z-index: 100; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header-logo { height: 70px; width: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2)); }
    .main-title { color: white; font-weight: 800; font-size: 1.2rem; }
    .dark-mode-toggle { background: rgba(255,255,255,0.2); width: 42px; height: 42px; border-radius: 30px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.3rem; cursor: pointer; border: none; }
    
    .services-section { background: #fff; margin: 12px 16px; border-radius: 28px; padding: 10px 12px 12px; border: 2px solid #f1e3e8; }
    .section-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; color: #8A1538; }
    .services-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .service-card { background: #fff; border-radius: 20px; padding: 8px 4px; text-align: center; border: 1px solid #ececec; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 80px; cursor: pointer; transition: all 0.2s ease; }
    .service-card:active { transform: scale(0.96); }
    .service-card i { font-size: 22px; color: #8A1538; }
    .service-card span { font-size: 0.7rem; font-weight: 600; color: #333; }
    
    .search-card { background: transparent; margin: 0 10px 18px; }
    .search-flex { position: relative; background: #fff; border-radius: 60px; padding: 10px 72px 10px 58px; display: flex; align-items: center; border: 3px solid #d7b27a; min-height: 70px; }
    .search-flex i:first-child { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: #8A1538; }
    .search-flex input { border: none; background: transparent; outline: none; width: 100%; font-size: 1rem; color: #444; font-weight: 600; padding: 8px 0; }
    .clear-search { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; border: none; background: linear-gradient(135deg,#8A1538,#d10f5a); color:#fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .service-filters { display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 12px; scrollbar-width: thin; white-space: nowrap; }
    .service-filters::-webkit-scrollbar { height: 3px; }
    .service-filters::-webkit-scrollbar-track { background: #e0e0e0; border-radius: 10px; }
    .service-filters::-webkit-scrollbar-thumb { background: #8A1538; border-radius: 10px; }
    .service-filter-chip { min-width: 100px; height: 44px; border-radius: 30px; background: #f3f5f9; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; font-size: 0.8rem; font-weight: 700; color: #4b5563; border: none; flex-shrink: 0; cursor: pointer; transition: all 0.2s ease; }
    .service-filter-chip i { font-size: 14px; }
    .service-filter-chip.active { background: linear-gradient(135deg,#8A1538,#b01252); color: #fff; }
    
    .customer-item { background: #fff; margin: 12px 0; border-radius: 28px; padding: 14px; border: 2px solid #8A1538; box-shadow: 0 6px 14px rgba(0,0,0,0.06); }
    .detail-line { display: flex; align-items: center; background: #fff; border: 1px solid #e5c48d; border-radius: 14px; margin-bottom: 10px; overflow: hidden; min-height: 48px; }
    .detail-line i { width: 40px; height: 40px; background: linear-gradient(135deg,#8A1538,#b01252); color:#fff; display: flex; align-items: center; justify-content: center; font-size: 16px; position: relative; }
    .detail-line i::after { content: ''; position: absolute; right: -7px; top: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-left: 7px solid #8A1538; }
    .detail-line b { color:#8A1538; min-width:78px; font-size:11px; font-weight:800; margin-left:14px; }
    .detail-line span { font-weight:700; font-size:0.85rem; padding:0 6px; color:#111; flex:1; }
    
    .customer-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .action-btn { width: 44px; height: 44px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s ease; text-decoration: none; font-size: 1.2rem; border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .action-btn:active { transform: scale(0.92); }
    .edit-item { background: linear-gradient(135deg, #2196F3, #1976D2); color: white; }
    .copy-item { background: linear-gradient(135deg, #4CAF50, #388E3C); color: white; }
    .whatsapp-item { background: linear-gradient(135deg, #25D366, #128C7E); color: white; }
    .call-item { background: linear-gradient(135deg, #00BCD4, #0097A7); color: white; }
    .delete-item { background: linear-gradient(135deg, #f44336, #d32f2f); color: white; }
    .register-fp-item { background: linear-gradient(135deg, #9C27B0, #7B1FA2); color: white; }
    
    .bottom-tab { position: fixed; bottom: 12px; left: 10px; right: 10px; background: rgba(255,255,255,0.95); backdrop-filter: blur(18px); border-radius: 34px; padding: 8px 12px; display: flex; justify-content: space-around; align-items: center; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .tab-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #7b8190; font-size: 0.75rem; font-weight: 600; flex: 1; cursor: pointer; padding: 6px 0; border-radius: 30px; }
    .tab-btn.active { color: #8A1538; background: rgba(138,21,56,0.1); }
    .fab-tab { width: 68px; height: 68px; border-radius: 50%; border: none; background: linear-gradient(135deg,#8A1538,#c2185b); color:#fff; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: -34px; box-shadow: 0 10px 25px rgba(138,21,56,0.35), 0 0 0 6px rgba(255,255,255,0.9); cursor: pointer; }
    .fab-tab:active { transform: scale(0.95); }
    
    .page { display: none; padding: 6px 0 20px; animation: fadeIn 0.25s ease; }
    .active-page { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
